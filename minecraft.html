<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Minecraft Quest - Naura</title>

    <link rel="stylesheet" href="mc-style.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <video autoplay muted loop playsinline preload="auto" id="mc-bg-video">
      <source src="assets/photos/live.mp4" type="video/mp4" />
    </video>

    <div class="video-overlay"></div>

    <div id="start-overlay" onclick="startQuest()">
      <div class="pixel-box">
        <h2 class="mc-font">[ SERVER ONLINE ]</h2>
        <p class="blink">TAP TO JOIN WORLD</p>
      </div>
    </div>

    <div class="mc-world">
      <div class="mc-header">
        <h1 class="mc-logo">NAURA EDITION</h1>
        <div id="splash" class="mc-splash">Happy Birthday!</div>
      </div>

      <div class="mc-menu">
        <button class="mc-btn" onclick="questAction('survival')">
          SURVIVAL MODE
        </button>
        <button
          id="btn-creative"
          class="mc-btn locked"
          onclick="questAction('creative')"
        >
          CREATIVE MODE 🔒
        </button>
      </div>

      <div class="mc-hotbar" id="main-hotbar"></div>

      <div id="adv-pop" class="mc-adv">
        <div class="adv-icon">🟡</div>
        <div class="adv-body">
          <div class="adv-top">Advancement Made!</div>
          <div id="adv-title" class="adv-bottom"></div>
        </div>
      </div>
    </div>

    <div id="mc-modal" class="mc-overlay">
      <div class="mc-modal-box">
        <h3 id="modal-title" style="color: #ffff55; margin-bottom: 10px"></h3>
        <p id="modal-desc" style="font-size: 11px; line-height: 1.6"></p>
        <button
          class="mc-btn"
          style="margin-top: 15px; width: 100px"
          onclick="closeMcModal()"
        >
          CLOSE
        </button>
      </div>
    </div>

    <audio id="bgm" loop>
      <source src="assets/Haggstrom.mp3" type="audio/mpeg" />
    </audio>
    <audio id="sfx-click">
      <source src="assets/Click.mp3" type="audio/mpeg" />
    </audio>
    <audio id="sfx-level">
      <source src="assets/Challenge_complete.ogg" type="audio/ogg" />
    </audio>

    <script src="mc-script.js"></script>
  </body>
</html>
