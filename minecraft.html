<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Mirip font Minecraft */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }
        .mc-card {
            background: #c6c6c6;
            border: 4px solid #ffffff;
            border-right-color: #555555;
            border-bottom-color: #555555;
            padding: 20px;
            width: 320px;
            text-align: center;
            image-rendering: pixelated;
        }
        .mc-title {
            color: #3f3f3f;
            text-shadow: 2px 2px #ffffff;
            margin-bottom: 20px;
        }
        .slot-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: #8b8b8b;
            padding: 10px;
            border: 4px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
        }
        .slot {
            width: 60px;
            height: 60px;
            background: #8b8b8b;
            border: 4px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .slot:hover { background: #9d9d9d; }
        .item-icon { font-size: 30px; }
        #message { margin-top: 20px; color: #52ad2d; font-weight: bold; }
    </style>
</head>
<body>
    <div class="mc-card">
        <h2 class="mc-title">Naura's Inventory</h2>
        <div class="slot-container">
            <div class="slot" onclick="reveal('🌹')"><span class="item-icon">🌹</span></div>
            <div class="slot" onclick="reveal('💎')"><span class="item-icon">💎</span></div>
            <div class="slot" onclick="reveal('🍰')"><span class="item-icon">🍰</span></div>
            <div class="slot" onclick="reveal('🐱')"><span class="item-icon">🐱</span></div>
            <div class="slot" onclick="reveal('💖')"><span class="item-icon">💖</span></div>
            <div class="slot" onclick="reveal('🏠')"><span class="item-icon">🏠</span></div>
        </div>
        <p id="message">Pilih item untuk di-craft!</p>
    </div>

    <script>
        function reveal(item) {
            const msg = document.getElementById('message');
            if(item === '💎') msg.innerText = "You found a Diamond! You're precious! ✨";
            if(item === '🍰') msg.innerText = "Happy Birthday! Let's eat cake! 🎂";
            if(item === '🐱') msg.innerText = "Miauww! Naura cat mode: ON! 🐾";
            if(item === '💖') msg.innerText = "Achievement Get: Falling in Love! ❤️";
            if(item === '🌹') msg.innerText = "A flower for the most beautiful girl.";
            if(item === '🏠') msg.innerText = "Wanna build a home together? 🏡";
        }
    </script>
</body>
</html>
