<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Minecraft Quest - Naura</title>
    <link rel="stylesheet" href="mc-style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="start-overlay">
        <div style="text-align: center">
            <h2 style="font-family: 'Minecraftia'; color: #fff;">[ SERVER ONLINE ]</h2>
            <p style="font-family: 'Minecraftia'; color: #aaa;">Tap to Start Quest</p>
        </div>
    </div>

    <audio id="bgm" loop><source src="assets/Haggstrom.mp3" type="audio/mpeg" /></audio>
    <audio id="sfx-click"><source src="assets/Click.mp3" type="audio/mpeg" /></audio>
    <audio id="sfx-challenge"><source src="assets/Challenge_complete.ogg" type="audio/ogg" /></audio>

    <div class="minecraft-screen">
        <div class="logo-container">
            <h1 class="main-title">NAURA'S QUEST</h1>
            <div id="splash" class="splash-text">Follow the Quest!</div>
        </div>

        <div class="menu-container">
            <button id="btn-creative" class="mc-button" onclick="checkPasscode()" style="opacity: 0.5;">CREATIVE MODE (Locked 🔒)</button>
            <button class="mc-button" onclick="window.location.href='index.html'">EXIT WORLD</button>
        </div>

        <div class="hotbar">
            <div class="hotbar-slot active-slot" id="slot-cake" onclick="eatCake(this)">
                <img src="https://minecraft.wiki/images/Cake_JE4.png" />
            </div>
            <div class="hotbar-slot" id="slot-diamond" onclick="openLoot('Diamond', 'Kamu adalah diamond paling berharga di server ini.', this)" style="display:none;">
                <img src="https://minecraft.wiki/images/Diamond_JE3_BE3.png" />
            </div>
            <div class="hotbar-slot" id="slot-heart" onclick="openLoot('Heart', 'Koordinat kado fisik telah terdeteksi!', this)" style="display:none;">
                <img src="https://minecraft.wiki/images/Heart_of_the_Sea_JE1_BE1.png" />
            </div>
        </div>
    </div>

    <div id="loot-modal" class="mc-modal">
        <div class="mc-modal-content">
            <h3 id="loot-title" style="color: #ffff55;"></h3>
            <div id="loot-text"></div>
            <button class="mc-button" style="margin-top: 20px; width: 120px" onclick="closeLoot()">CLOSE</button>
        </div>
    </div>

    <div id="advancement" class="advancement">
        <div class="adv-iconbox">🟡</div>
        <div class="adv-text">
            <div class="adv-title-yellow">Advancement Made!</div>
            <div id="adv-title" style="color: white; font-size: 10px;"></div>
            <div id="adv-desc" style="color: white; font-size: 8px; opacity: 0.8;"></div>
        </div>
    </div>

    <script src="mc-script.js"></script>
</body>
</html>
