<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Surprise - Naura</title>
    <link rel="stylesheet" href="mc-style.css">
</head>
<body>

    <h2 id="title-hint">Pilih Item Kesukaanmu!</h2>

    <div class="chest-container" onclick="openChest()">
        <div id="chest-icon">📦</div>
    </div>

    <div class="inventory">
        <div class="item-slot" onclick="selectItem(this, '🐱')">🐱</div>
        <div class="item-slot" onclick="selectItem(this, '💎')">💎</div>
        <div class="item-slot" onclick="selectItem(this, '🍰')">🍰</div>
        <div class="item-slot" onclick="selectItem(this, '💖')">💖</div>
    </div>

    <div class="game-ui" id="instruction">
        Pilih semua item dulu, lalu klik box-nya!
    </div>

    <div id="gift-popup" class="hidden-gift">
        <h3>ACHIEVEMENT UNLOCKED!</h3>
        <p>Kamu berhasil merakit kasih sayangku!</p>
        <p id="gift-location">Cek di bawah bantal kamu sekarang! 🎁</p>
        <button class="btn-claim" onclick="location.reload()">Main Lagi?</button>
    </div>

    <script src="mc-script.js"></script>
</body>
</html>
